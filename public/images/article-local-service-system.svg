<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Local service lead generation system</title>
  <desc id="desc">Intent, proof, action and measurement connected in an acquisition dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071c2c"/>
      <stop offset="1" stop-color="#0d2f4a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#020b12" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1460" cy="90" r="310" fill="#ff6b3d" opacity=".12"/>
  <circle cx="120" cy="820" r="330" fill="#43c59e" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="170" y="145" width="1260" height="610" rx="42" fill="url(#card)"/>
  </g>
  <rect x="170" y="145" width="1260" height="92" rx="42" fill="#eef2f6"/>
  <circle cx="228" cy="191" r="9" fill="#ff6b3d"/>
  <circle cx="258" cy="191" r="9" fill="#43c59e"/>
  <circle cx="288" cy="191" r="9" fill="#4a63ff"/>
  <text x="340" y="202" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#071c2c">Intent &amp; Proof acquisition system</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="230" y="290" width="255" height="170" rx="24" fill="#e7f8f2"/>
    <text x="262" y="336" font-size="22" font-weight="800" fill="#08795c">01 · INTENT</text>
    <text x="262" y="383" font-size="34" font-weight="800" fill="#071c2c">84</text>
    <rect x="262" y="410" width="175" height="12" rx="6" fill="#cfe5dd"/>
    <rect x="262" y="410" width="147" height="12" rx="6" fill="#43c59e"/>

    <rect x="530" y="290" width="255" height="170" rx="24" fill="#fff0e9"/>
    <text x="562" y="336" font-size="22" font-weight="800" fill="#cf4210">02 · PROOF</text>
    <text x="562" y="383" font-size="34" font-weight="800" fill="#071c2c">61</text>
    <rect x="562" y="410" width="175" height="12" rx="6" fill="#f0d8ce"/>
    <rect x="562" y="410" width="107" height="12" rx="6" fill="#ff6b3d"/>

    <rect x="830" y="290" width="255" height="170" rx="24" fill="#edf0ff"/>
    <text x="862" y="336" font-size="22" font-weight="800" fill="#3047dc">03 · ACTION</text>
    <text x="862" y="383" font-size="34" font-weight="800" fill="#071c2c">68</text>
    <rect x="862" y="410" width="175" height="12" rx="6" fill="#d8ddf7"/>
    <rect x="862" y="410" width="119" height="12" rx="6" fill="#4a63ff"/>

    <rect x="1130" y="290" width="240" height="170" rx="24" fill="#e7f8f2"/>
    <text x="1162" y="336" font-size="22" font-weight="800" fill="#08795c">04 · MEASURE</text>
    <text x="1162" y="383" font-size="34" font-weight="800" fill="#071c2c">79</text>
    <rect x="1162" y="410" width="160" height="12" rx="6" fill="#cfe5dd"/>
    <rect x="1162" y="410" width="126" height="12" rx="6" fill="#43c59e"/>

    <rect x="230" y="520" width="1140" height="170" rx="28" fill="#071c2c"/>
    <text x="274" y="570" font-size="20" font-weight="800" letter-spacing="2" fill="#43c59e">NEXT BEST ACTION</text>
    <text x="274" y="625" font-size="34" font-weight="800" fill="#ffffff">Repair enquiry tracking before increasing campaign spend.</text>
    <circle cx="1305" cy="605" r="34" fill="#ff6b3d"/>
    <path d="M1291 605h28m-10-10 10 10-10 10" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
