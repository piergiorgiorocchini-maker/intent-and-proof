name: Fix dental key takeaways

on:
  push:
    paths:
      - ".github/workflows/fix-dental-key-takeaways.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Quote YAML key takeaway
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/content/articles/marketing-odontoiatrico-seo-dentisti-it.md')
          text = path.read_text()
          old = '  - Un lead non è un paziente: il sistema deve misurare richieste, appuntamenti fissati, prime visite svolte e risultati economici interni.\n'
          new = '  - "Un lead non è un paziente: il sistema deve misurare richieste, appuntamenti fissati, prime visite svolte e risultati economici interni."\n'
          if old not in text:
              raise SystemExit('Expected key takeaway not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/fix-dental-key-takeaways.yml
          git add src/content/articles/marketing-odontoiatrico-seo-dentisti-it.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix dental article key takeaways schema"
          git push
