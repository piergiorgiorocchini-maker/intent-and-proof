name: Materialize dental article

on:
  push:
    paths:
      - ".github/workflows/materialize-dental-article.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build article
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/content/articles
          cat tmp/dental-article-parts/part-*.txt > src/content/articles/marketing-odontoiatrico-seo-dentisti-it.md
          test -s src/content/articles/marketing-odontoiatrico-seo-dentisti-it.md
          grep -q "translationKey: marketing-odontoiatrico-seo-dentisti" src/content/articles/marketing-odontoiatrico-seo-dentisti-it.md
          grep -q "noIndex: false" src/content/articles/marketing-odontoiatrico-seo-dentisti-it.md
          git rm -r tmp/dental-article-parts
          git rm .github/workflows/materialize-dental-article.yml
          git add src/content/articles/marketing-odontoiatrico-seo-dentisti-it.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish Italian dental SEO pillar article"
          git push
